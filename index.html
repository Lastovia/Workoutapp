<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="健身即時紀錄">
  <meta name="theme-color" content="#000000">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ios: {
              bg: '#000000',
              card: '#1C1C1E',
              cardElevated: '#2C2C2E',
              separator: '#38383A',
              blue: '#0A84FF',
              green: '#30D158',
              orange: '#FF9F0A',
              red: '#FF453A',
              label: '#FFFFFF',
              secondaryLabel: '#8E8E93',
              tertiaryLabel: '#48484A',
            }
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }
    input, textarea {
      user-select: auto;
    }
    html, body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      width: 100%;
    }
    .safe-top { padding-top: max(env(safe-area-inset-top), 16px); }
    .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom), 20px); }
    .press-scale {
      transition: transform 0.1s cubic-bezier(0, 0, 0.2, 1);
    }
    .press-scale:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body class="bg-ios-bg text-ios-label min-h-screen flex flex-col justify-between safe-top safe-bottom px-4 max-w-md mx-auto">

  <!-- 頂部資訊列 -->
  <div>
    <div class="flex items-center justify-between pt-1 pb-2">
      <div class="flex items-center space-x-1.5 text-ios-secondaryLabel text-xs font-medium">
        <i class="ph-bold ph-calendar text-sm"></i>
        <span id="currentDateText">2026年10月29日 星期四</span>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="toggleModal('infoModal')" class="w-8 h-8 rounded-full bg-ios-cardElevated flex items-center justify-center text-ios-blue press-scale">
          <i class="ph-bold ph-info text-base"></i>
        </button>
        <button onclick="toggleModal('historyModal')" class="w-8 h-8 rounded-full bg-ios-cardElevated flex items-center justify-center text-ios-blue press-scale">
          <i class="ph-bold ph-list-dashes text-base"></i>
        </button>
      </div>
    </div>

    <!-- 標題與分化切換按鈕 -->
    <div class="flex items-center justify-between mt-1 mb-3">
      <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
        健身即時紀錄
        <span class="text-xs px-2 py-0.5 rounded-full bg-ios-green/20 text-ios-green font-semibold">iPhone版</span>
      </h1>
    </div>

    <!-- 分段控制 (Segmented Control) -->
    <div class="bg-ios-card p-1 rounded-xl flex items-center border border-ios-separator/50 mb-3 text-sm font-semibold">
      <button id="tabChestLeg" onclick="setSplit('chestLeg')" class="flex-1 py-1.5 rounded-lg text-center transition-all bg-ios-cardElevated text-white shadow">
        胸 + 腿訓練日
      </button>
      <button id="tabShoulderBack" onclick="setSplit('shoulderBack')" class="flex-1 py-1.5 rounded-lg text-center transition-all text-ios-secondaryLabel">
        肩 + 背訓練日
      </button>
    </div>

    <!-- 靈動島膠囊狀縮小版計時器 (預設隱藏) -->
    <div id="minTimerPill" onclick="expandTimer()" class="hidden mb-3 bg-gradient-to-r from-emerald-950/80 to-zinc-900 border border-ios-green/50 px-4 py-2 rounded-full flex items-center justify-between cursor-pointer press-scale shadow-lg">
      <div class="flex items-center space-x-2">
        <span class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-ios-green opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-ios-green"></span>
        </span>
        <span class="text-xs text-ios-secondaryLabel font-medium">休息倒數中</span>
      </div>
      <div class="flex items-center space-x-2">
        <span id="minTimerVal" class="text-sm font-bold font-mono text-ios-green">01:30</span>
        <i class="ph-bold ph-arrows-out-simple text-xs text-ios-secondaryLabel"></i>
      </div>
    </div>

    <!-- 完整版組間休息倒數計時器 (可縮小、可關閉) -->
    <div id="fullTimerCard" class="hidden mb-3 bg-ios-card border border-ios-green/30 rounded-2xl p-3.5 relative overflow-hidden transition-all">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-ios-green/15 flex items-center justify-center text-ios-green">
            <i class="ph-bold ph-hourglass-high text-xl"></i>
          </div>
          <div>
            <div class="text-[11px] text-ios-secondaryLabel font-medium">組間休息倒數</div>
            <div id="fullTimerVal" class="text-2xl font-black font-mono tracking-tight text-ios-green">01:30</div>
          </div>
        </div>
        <div class="flex items-center space-x-1.5">
          <button onclick="addRestTime(30)" class="px-2.5 py-1.5 bg-ios-cardElevated rounded-lg text-xs font-semibold text-white press-scale border border-ios-separator">
            +30秒
          </button>
          <button onclick="minimizeTimer()" title="縮小" class="w-8 h-8 rounded-lg bg-ios-cardElevated flex items-center justify-center text-ios-secondaryLabel press-scale border border-ios-separator">
            <i class="ph-bold ph-arrows-in-simple text-sm"></i>
          </button>
          <button onclick="closeTimer()" title="結束" class="w-8 h-8 rounded-lg bg-ios-cardElevated flex items-center justify-center text-ios-red press-scale border border-ios-separator">
            <i class="ph-bold ph-x text-sm"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- 動作晶片選擇區 -->
    <div class="bg-ios-card rounded-2xl p-3.5 border border-ios-separator/40 mb-3">
      <div id="exerciseChips" class="grid grid-cols-4 gap-2">
        <!-- JS 動態生成 -->
      </div>
    </div>

    <!-- 前次紀錄提示卡 -->
    <div class="bg-ios-card rounded-xl px-3.5 py-2.5 border border-ios-separator/40 mb-3 flex items-center justify-between text-xs">
      <div class="flex items-center space-x-2">
        <i class="ph-bold ph-clock-counter-clockwise text-ios-green text-sm"></i>
        <div>
          <span class="text-ios-secondaryLabel">前次動作紀錄：</span>
          <span id="lastRecordLabel" class="font-semibold text-white">尚無紀錄</span>
        </div>
      </div>
      <button id="applyLastBtn" onclick="applyLastRecord()" class="hidden px-2 py-1 bg-ios-cardElevated rounded text-ios-orange text-[11px] font-semibold press-scale">
        套用數值
      </button>
    </div>

    <!-- 核心數據輸入卡片 -->
    <div class="bg-ios-card rounded-2xl p-4 border border-ios-separator/50 mb-3">
      <div class="flex items-center justify-between pb-3 border-b border-ios-separator/40 mb-3.5">
        <div>
          <span class="text-[11px] text-ios-secondaryLabel block uppercase font-medium">當前記錄項目</span>
          <span id="currentExName" class="text-xl font-black text-white">胸推</span>
        </div>
        <div class="text-right">
          <span class="text-[11px] text-ios-secondaryLabel block uppercase font-medium">目標組別</span>
          <span id="currentSetLabel" class="text-xl font-black text-ios-green">第 1 組</span>
        </div>
      </div>

      <!-- 重量設定區 -->
      <div class="mb-4">
        <div class="flex items-center justify-between text-xs mb-2">
          <span class="text-ios-secondaryLabel font-semibold">使用重量 (KG)</span>
          <span class="text-ios-secondaryLabel text-[11px]">微調步進</span>
        </div>
        <div class="grid grid-cols-5 gap-1.5 items-center w-full">
          <button onclick="adjustWeight(-5)" class="h-12 rounded-xl bg-ios-cardElevated text-xs font-bold text-ios-secondaryLabel press-scale border border-ios-separator/50">-5</button>
          <button onclick="adjustWeight(-2.5)" class="h-12 rounded-xl bg-ios-cardElevated text-xs font-bold text-ios-secondaryLabel press-scale border border-ios-separator/50">-2.5</button>
          <div class="h-12 rounded-xl bg-black border border-ios-separator flex items-center justify-center">
            <input type="number" id="weightInput" value="30" step="0.5" class="w-full text-center text-xl font-black bg-transparent text-white focus:outline-none" />
          </div>
          <button onclick="adjustWeight(2.5)" class="h-12 rounded-xl bg-ios-cardElevated text-xs font-bold text-ios-green press-scale border border-ios-separator/50">+2.5</button>
          <button onclick="adjustWeight(5)" class="h-12 rounded-xl bg-ios-cardElevated text-xs font-bold text-ios-green press-scale border border-ios-separator/50">+5</button>
        </div>
      </div>

      <!-- 次數設定區 (修正：按鈕自適應不爆框，快捷鍵改為 3、5、7 次) -->
      <div class="mb-4">
        <div class="flex items-center justify-between text-xs mb-2">
          <span class="text-ios-secondaryLabel font-semibold">完成次數 (REPS)</span>
          <!-- 快捷鍵修改為 3次 5次 7次 -->
          <div class="flex space-x-1.5">
            <button onclick="setQuickReps(3)" class="px-2 py-0.5 rounded bg-ios-cardElevated text-[11px] font-semibold text-ios-secondaryLabel press-scale">3 次</button>
            <button onclick="setQuickReps(5)" class="px-2 py-0.5 rounded bg-ios-cardElevated text-[11px] font-semibold text-ios-secondaryLabel press-scale">5 次</button>
            <button onclick="setQuickReps(7)" class="px-2 py-0.5 rounded bg-ios-cardElevated text-[11px] font-semibold text-ios-secondaryLabel press-scale">7 次</button>
          </div>
        </div>
        <!-- 採用百分比彈性格狀排版，完美收納於螢幕寬度內 -->
        <div class="grid grid-cols-5 gap-1.5 items-center w-full">
          <button onclick="adjustReps(-1)" class="col-span-1 h-12 rounded-xl bg-ios-cardElevated text-2xl font-bold text-white press-scale border border-ios-separator/50 flex items-center justify-center">-</button>
          <div class="col-span-3 h-12 rounded-xl bg-black border border-ios-separator flex items-center justify-center">
            <input type="number" id="repsInput" value="5" class="w-full text-center text-xl font-black bg-transparent text-white focus:outline-none" />
          </div>
          <button onclick="adjustReps(1)" class="col-span-1 h-12 rounded-xl bg-ios-cardElevated text-2xl font-bold text-white press-scale border border-ios-separator/50 flex items-center justify-center">+</button>
        </div>
      </div>

      <!-- 體感標籤快捷 -->
      <div class="flex flex-wrap gap-1.5 mb-3">
        <button onclick="toggleTag('順暢')" class="tag-btn text-xs px-2.5 py-1 rounded-lg bg-ios-cardElevated text-ios-secondaryLabel press-scale">👍 順暢</button>
        <button onclick="toggleTag('力竭')" class="tag-btn text-xs px-2.5 py-1 rounded-lg bg-ios-cardElevated text-ios-secondaryLabel press-scale">🔥 力竭</button>
        <button onclick="toggleTag('下次加重')" class="tag-btn text-xs px-2.5 py-1 rounded-lg bg-ios-cardElevated text-ios-secondaryLabel press-scale">📈 下次加重</button>
        <button onclick="toggleTag('姿勢調整')" class="tag-btn text-xs px-2.5 py-1 rounded-lg bg-ios-cardElevated text-ios-secondaryLabel press-scale">🎯 姿勢調整</button>
      </div>

      <input type="text" id="noteInput" placeholder="自訂備註 (選填)..." class="w-full bg-ios-cardElevated border border-ios-separator/40 rounded-xl px-3 py-2 text-xs text-white placeholder-ios-secondaryLabel/60 focus:outline-none mb-3" />

      <!-- 主送出按鈕 -->
      <button onclick="recordCurrentSet()" class="w-full py-3.5 rounded-2xl bg-ios-green text-black font-extrabold text-base flex items-center justify-center space-x-2 press-scale shadow-lg shadow-ios-green/20">
        <i class="ph-bold ph-check text-lg"></i>
        <span>記錄此組 (自動啟動計時)</span>
      </button>
    </div>

    <!-- 底部休息時間預設設定 -->
    <div class="flex items-center justify-between px-1 text-xs text-ios-secondaryLabel">
      <span class="flex items-center gap-1"><i class="ph ph-timer"></i> 預設休息：</span>
      <div class="flex space-x-1.5">
        <button onclick="setDefaultRest(60)" class="rest-preset-btn px-2.5 py-1 rounded-md bg-ios-card press-scale border border-ios-separator/40">60秒</button>
        <button onclick="setDefaultRest(90)" class="rest-preset-btn px-2.5 py-1 rounded-md bg-ios-card text-ios-green font-bold press-scale border border-ios-separator/40">90秒</button>
        <button onclick="setDefaultRest(120)" class="rest-preset-btn px-2.5 py-1 rounded-md bg-ios-card press-scale border border-ios-separator/40">120秒</button>
      </div>
    </div>
  </div>

  <!-- 歷史與匯出彈窗 (History Modal) -->
  <div id="historyModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex flex-col justify-end">
    <div class="bg-ios-card rounded-t-3xl p-5 max-h-[85vh] flex flex-col border-t border-ios-separator">
      <div class="flex justify-between items-center pb-3 border-b border-ios-separator">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="ph-bold ph-clock-counter-clockwise"></i> 訓練紀錄清單
        </h3>
        <button onclick="toggleModal('historyModal')" class="text-ios-secondaryLabel text-sm press-scale">關閉</button>
      </div>
      <div id="historyListContainer" class="overflow-y-auto flex-1 my-3 space-y-2 text-xs">
        <!-- 動態塞入 -->
      </div>
      <div class="grid grid-cols-2 gap-2 pt-2 border-t border-ios-separator">
        <button onclick="exportCSV()" class="py-2.5 bg-ios-cardElevated rounded-xl font-bold text-white flex items-center justify-center gap-1.5 press-scale border border-ios-separator">
          <i class="ph-bold ph-download-simple"></i> 下載 CSV
        </button>
        <button onclick="copyToClipboard()" class="py-2.5 bg-ios-blue text-white rounded-xl font-bold flex items-center justify-center gap-1.5 press-scale">
          <i class="ph-bold ph-copy"></i> 複製貼上表格
        </button>
      </div>
    </div>
  </div>

  <!-- 說明彈窗 (Info Modal) -->
  <div id="infoModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-ios-card rounded-2xl p-5 max-w-xs w-full border border-ios-separator text-xs">
      <h3 class="text-base font-bold text-white mb-2">使用小提示</h3>
      <p class="text-ios-secondaryLabel mb-2">1. 點擊「記錄此組」後自動儲存並開始休息計時。</p>
      <p class="text-ios-secondaryLabel mb-2">2. 計時器若擋住視線，可點擊右上角縮小為膠囊藥丸，點擊藥丸隨時展開。</p>
      <p class="text-ios-secondaryLabel mb-4">3. 記錄隨時可於右上角清單匯出並同步至 Google 試算表。</p>
      <button onclick="toggleModal('infoModal')" class="w-full py-2 bg-ios-cardElevated rounded-xl font-bold text-white press-scale">我知道了</button>
    </div>
  </div>

  <script>
    const menus = {
      chestLeg: ['胸推', '胸飛鳥', '反向飛鳥', '二頭彎舉', '腿推', '腿後勾', '膝屈伸'],
      shoulderBack: ['肩推', '側平舉', '三頭下壓', '正握下拉', '反握下拉', '坐姿划船']
    };

    let state = {
      split: 'chestLeg',
      exercise: '胸推',
      weight: 30,
      reps: 5,
      set: 1,
      tags: [],
      defaultRest: 90,
      restLeft: 0,
      timerId: null,
      isTimerMinimized: false
    };

    const d = new Date();
    document.getElementById('currentDateText').innerText = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${['日','一','二','三','四','五','六'][d.getDay()]}`;

    function init() {
      renderChips();
      updateExerciseUI();
    }

    function setSplit(split) {
      state.split = split;
      state.exercise = menus[split][0];
      state.set = 1;

      document.getElementById('tabChestLeg').className = split === 'chestLeg'
        ? 'flex-1 py-1.5 rounded-lg text-center transition-all bg-ios-cardElevated text-white shadow'
        : 'flex-1 py-1.5 rounded-lg text-center transition-all text-ios-secondaryLabel';

      document.getElementById('tabShoulderBack').className = split === 'shoulderBack'
        ? 'flex-1 py-1.5 rounded-lg text-center transition-all bg-ios-cardElevated text-white shadow'
        : 'flex-1 py-1.5 rounded-lg text-center transition-all text-ios-secondaryLabel';

      renderChips();
      updateExerciseUI();
    }

    function renderChips() {
      const container = document.getElementById('exerciseChips');
      container.innerHTML = '';
      menus[state.split].forEach(ex => {
        const btn = document.createElement('button');
        const isActive = ex === state.exercise;
        btn.className = `py-2 px-1 text-xs font-semibold rounded-xl transition-all press-scale truncate ${
          isActive ? 'bg-ios-green text-black font-bold shadow-md shadow-ios-green/20' : 'bg-ios-cardElevated text-ios-secondaryLabel'
        }`;
        btn.innerText = ex;
        btn.onclick = () => selectExercise(ex);
        container.appendChild(btn);
      });
    }

    function selectExercise(ex) {
      state.exercise = ex;
      state.set = 1;
      renderChips();
      updateExerciseUI();
    }

    function updateExerciseUI() {
      document.getElementById('currentExName').innerText = state.exercise;
      document.getElementById('currentSetLabel').innerText = `第 ${state.set} 組`;

      const last = JSON.parse(localStorage.getItem(`last_${state.exercise}`) || 'null');
      const label = document.getElementById('lastRecordLabel');
      const applyBtn = document.getElementById('applyLastBtn');

      if (last) {
        label.innerText = `${last.weight} kg × ${last.reps} 次`;
        applyBtn.classList.remove('hidden');
      } else {
        label.innerText = '尚無紀錄 (首次訓練)';
        applyBtn.classList.add('hidden');
      }
    }

    function applyLastRecord() {
      const last = JSON.parse(localStorage.getItem(`last_${state.exercise}`) || 'null');
      if (last) {
        state.weight = parseFloat(last.weight);
        state.reps = parseInt(last.reps);
        document.getElementById('weightInput').value = state.weight;
        document.getElementById('repsInput').value = state.reps;
      }
    }

    function adjustWeight(delta) {
      const input = document.getElementById('weightInput');
      let val = Math.max(0, (parseFloat(input.value) || 0) + delta);
      input.value = val;
      state.weight = val;
    }

    function adjustReps(delta) {
      const input = document.getElementById('repsInput');
      let val = Math.max(1, (parseInt(input.value) || 0) + delta);
      input.value = val;
      state.reps = val;
    }

    function setQuickReps(r) {
      document.getElementById('repsInput').value = r;
      state.reps = r;
    }

    function toggleTag(tagName) {
      const idx = state.tags.indexOf(tagName);
      if (idx > -1) {
        state.tags.splice(idx, 1);
      } else {
        state.tags.push(tagName);
      }
      document.querySelectorAll('.tag-btn').forEach(btn => {
        const text = btn.innerText;
        if (text.includes(tagName)) {
          if (state.tags.includes(tagName)) {
            btn.classList.add('bg-ios-orange/20', 'text-ios-orange', 'border-ios-orange');
          } else {
            btn.classList.remove('bg-ios-orange/20', 'text-ios-orange', 'border-ios-orange');
          }
        }
      });
    }

    function recordCurrentSet() {
      state.weight = parseFloat(document.getElementById('weightInput').value) || 0;
      state.reps = parseInt(document.getElementById('repsInput').value) || 0;
      const note = document.getElementById('noteInput').value.trim();
      const fullNote = [...state.tags, note].filter(Boolean).join('、');

      const record = {
        date: document.getElementById('currentDateText').innerText,
        split: state.split === 'chestLeg' ? '胸 + 腿訓練日' : '肩 + 背訓練日',
        exercise: state.exercise,
        set: state.set,
        weight: state.weight,
        reps: state.reps,
        volume: state.weight * state.reps,
        note: fullNote,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      // 存入 LocalStorage
      localStorage.setItem(`last_${state.exercise}`, JSON.stringify(record));
      let history = JSON.parse(localStorage.getItem('workout_history') || '[]');
      history.unshift(record);
      localStorage.setItem('workout_history', JSON.stringify(history));

      // 震動回饋 (iOS Safari 支援時)
      if (navigator.vibrate) navigator.vibrate(40);

      // 遞增組數
      state.set += 1;
      document.getElementById('currentSetLabel').innerText = `第 ${state.set} 組`;
      document.getElementById('noteInput').value = '';
      state.tags = [];
      document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('bg-ios-orange/20', 'text-ios-orange', 'border-ios-orange'));

      // 自動啟動組間休息計時
      startTimer(state.defaultRest);
      updateExerciseUI();
    }

    // 計時器邏輯（支援縮小與還原）
    function startTimer(seconds) {
      clearInterval(state.timerId);
      state.restLeft = seconds;
      updateTimerDisplay();

      if (state.isTimerMinimized) {
        document.getElementById('minTimerPill').classList.remove('hidden');
        document.getElementById('fullTimerCard').classList.add('hidden');
      } else {
        document.getElementById('fullTimerCard').classList.remove('hidden');
        document.getElementById('minTimerPill').classList.add('hidden');
      }

      state.timerId = setInterval(() => {
        state.restLeft--;
        updateTimerDisplay();
        if (state.restLeft <= 0) {
          clearInterval(state.timerId);
          closeTimer();
          if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const m = Math.floor(state.restLeft / 60).toString().padStart(2, '0');
      const s = (state.restLeft % 60).toString().padStart(2, '0');
      const text = `${m}:${s}`;
      document.getElementById('fullTimerVal').innerText = text;
      document.getElementById('minTimerVal').innerText = text;
    }

    function addRestTime(sec) {
      state.restLeft += sec;
      updateTimerDisplay();
    }

    function minimizeTimer() {
      state.isTimerMinimized = true;
      document.getElementById('fullTimerCard').classList.add('hidden');
      document.getElementById('minTimerPill').classList.remove('hidden');
    }

    function expandTimer() {
      state.isTimerMinimized = false;
      document.getElementById('minTimerPill').classList.add('hidden');
      document.getElementById('fullTimerCard').classList.remove('hidden');
    }

    function closeTimer() {
      clearInterval(state.timerId);
      document.getElementById('fullTimerCard').classList.add('hidden');
      document.getElementById('minTimerPill').classList.add('hidden');
    }

    function setDefaultRest(sec) {
      state.defaultRest = sec;
      document.querySelectorAll('.rest-preset-btn').forEach(b => {
        b.className = b.innerText.includes(sec)
          ? 'rest-preset-btn px-2.5 py-1 rounded-md bg-ios-card text-ios-green font-bold press-scale border border-ios-separator/40'
          : 'rest-preset-btn px-2.5 py-1 rounded-md bg-ios-card text-ios-secondaryLabel press-scale border border-ios-separator/40';
      });
    }

    function toggleModal(id) {
      const el = document.getElementById(id);
      if (el.classList.contains('hidden')) {
        if (id === 'historyModal') renderHistoryList();
        el.classList.remove('hidden');
      } else {
        el.classList.add('hidden');
      }
    }

    function renderHistoryList() {
      const container = document.getElementById('historyListContainer');
      const list = JSON.parse(localStorage.getItem('workout_history') || '[]');
      if (list.length === 0) {
        container.innerHTML = '<div class="text-center py-6 text-ios-secondaryLabel">尚未有訓練紀錄</div>';
        return;
      }
      container.innerHTML = list.map(item => `
        <div class="bg-ios-cardElevated p-2.5 rounded-xl border border-ios-separator/40 flex justify-between items-center">
          <div>
            <div class="font-bold text-white text-sm">${item.exercise} <span class="text-xs text-ios-green font-normal">第 ${item.set} 組</span></div>
            <div class="text-[11px] text-ios-secondaryLabel">${item.weight} kg × ${item.reps} 次 • 總負荷 ${item.volume} kg ${item.note ? '• ' + item.note : ''}</div>
          </div>
          <div class="text-[11px] text-ios-secondaryLabel font-mono">${item.timestamp}</div>
        </div>
      `).join('');
    }

    function exportCSV() {
      const list = JSON.parse(localStorage.getItem('workout_history') || '[]');
      if (list.length === 0) return alert('無紀錄可匯出');
      let csv = '日期,訓練類別,健身項目,組別,使用重量(kg),每組次數,總負荷(kg),備註,時間\n';
      list.forEach(r => {
        csv += `"${r.date}","${r.split}","${r.exercise}",${r.set},${r.weight},${r.reps},${r.volume},"${r.note}","${r.timestamp}"\n`;
      });
      const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `健身紀錄_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    function copyToClipboard() {
      const list = JSON.parse(localStorage.getItem('workout_history') || '[]');
      if (list.length === 0) return alert('無紀錄可複製');
      let text = '日期\t訓練類別\t健身項目\t組別\t使用重量\t次數\t備註\n';
      list.forEach(r => {
        text += `${r.date}\t${r.split}\t${r.exercise}\t第${r.set}組\t${r.weight}kg\t${r.reps}次\t${r.note}\n`;
      });
      navigator.clipboard.writeText(text).then(() => {
        alert('已複製表格內容！可直接開啟 Google 試算表貼上。');
      });
    }

    init();
  </script>
</body>
</html>
